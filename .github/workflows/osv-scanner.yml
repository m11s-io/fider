name: OSV dependency scan

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '48 3 * * 2'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: osv-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    uses: m11s-io/.github/.github/workflows/osv-scanner.yml@3874c82162a3a592e1729ca2e73dad488b117cf0
