name: publish

on:
  workflow_run:
    workflows: ["build"]
    types:
      - completed

jobs:
  publish:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Dump GitHub context
        run: echo "$GITHUB_CONTEXT"
        env:
          GITHUB_CONTEXT: ${{ toJSON(github) }}

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}

      - name: build and push docker image (pull_request)
        if: ${{ github.event.workflow_run.event == 'pull_request' }}
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          push: true
          context: .
          build-args: COMMITHASH=${{ github.event.workflow_run.head_sha }}
          platforms: linux/amd64
          tags: m11s/fider:PR_${{ github.event.workflow_run.pull_requests[0].number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: build and push docker image (push branch)
        if: ${{ github.event.workflow_run.event == 'push' }}
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          push: true
          context: .
          build-args: COMMITHASH=${{ github.event.workflow_run.head_sha }}
          platforms: linux/amd64,linux/arm64/v8
          tags: |
            m11s/fider:SHA_${{ github.event.workflow_run.head_sha }}
            m11s/fider:${{ github.event.workflow_run.head_branch == 'main' && 'main' || 'stable' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: build and push docker image (push tag)
        if: ${{ github.event.workflow_run.event == 'release' }}
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          push: true
          context: .
          build-args: |
            COMMITHASH=${{ github.event.workflow_run.head_sha }}
            VERSION=${{ github.event.workflow_run.display_title }}
          platforms: linux/amd64,linux/arm64/v8
          tags: m11s/fider:${{ github.event.workflow_run.display_title }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
