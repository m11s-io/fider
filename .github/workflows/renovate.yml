# Managed by infra/github; edit the shared workflow or its OpenTofu settings.
name: Renovate

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      dry-run:
        description: Inspect updates without writing to GitHub
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    if: ${{ github.event_name == 'workflow_dispatch' || true }}
    uses: m11s-io/.github/.github/workflows/renovate-run.yml@main
    with:
      host-ref: main
      live: ${{ true && (github.event_name != 'workflow_dispatch' || !inputs.dry-run) }}
    secrets:
      RENOVATE_APP_PRIVATE_KEY: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
