name: build

on:
  release:
    types: [published]
  push:
    branches:
      - main
      - stable
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-ui:
    timeout-minutes: 60
    name: test-ui
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Use Node.js 22.x
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.x
          cache: 'npm'
      - run: npm ci
      - run: make lint-ui
      - run: make test-ui

  test-server:
    timeout-minutes: 60
    name: test-server
    runs-on: ubuntu-26.04
    services:
      minio:
        image: getfider/minio:0.0.2@sha256:591c64521d531a937b9ffc8bf2546fea783785112a076f35821a9c65bc038fb2
        ports:
          - 9000:9000
        env:
          MINIO_ACCESS_KEY: s3user
          MINIO_SECRET_KEY: s3user-s3cr3t
      postgres:
        image: postgres:17@sha256:3b0cda93be7c8dba2ed484d19393d93845dc3dafb88973e248ba8e6d99d784e1
        env:
          POSTGRES_USER: fider_ci
          POSTGRES_PASSWORD: fider_ci_pw
          POSTGRES_DB: fider_ci
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Use Go 1.25
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.25'
          cache: true
      - name: Use Node.js 22.x
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.x
          cache: 'npm'
      - run: npm ci # required for esbuild
      - name: install golangci-lint
        run: curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b $(go env GOPATH)/bin v2.7.2
      - name: install godotenv
        run: go install github.com/joho/godotenv/cmd/godotenv
      - run: make lint-server
      - name: make test-server
        run: |
          mkdir ./dist
          make test-server SHORT=false
        env:
          BLOB_STORAGE_S3_ENDPOINT_URL: http://localhost:9000
          DATABASE_URL: postgres://fider_ci:fider_ci_pw@localhost:5432/fider_ci?sslmode=disable

  # The build job uses the Dockerfile to build an image which is then used by e2e tests
  build:
    timeout-minutes: 60
    name: build
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: extract variables
        run: |
          echo "sha7=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          echo sha7=${GITHUB_SHA::7}
        id: vars

      - run: docker build -t fider-image .

      - run: mkdir -p ./out

      - run: docker save -o ./out/fider-image.tar fider-image

      - run: echo ${{ github.event.number }} > ./out/pr
        if: ${{ github.event_name == 'pull_request' }}

      - run: echo ${{ steps.vars.outputs.sha7 }} > ./out/sha7

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: fider-image
          path: out/

  test-e2e-ui:
    timeout-minutes: 60
    name: test-e2e-ui
    runs-on: ubuntu-26.04
    needs: [build]
    services:
      mailhog:
        image: mailhog/mailhog:latest@sha256:8d76a3d4ffa32a3661311944007a415332c4bb855657f4f6c57996405c009bea
        ports:
          - "8025:8025"
          - "1025:1025"
      postgres:
        image: postgres:17@sha256:3b0cda93be7c8dba2ed484d19393d93845dc3dafb88973e248ba8e6d99d784e1
        env:
          POSTGRES_USER: fider_ci
          POSTGRES_PASSWORD: fider_ci_pw
          POSTGRES_DB: fider_ci
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    strategy:
      fail-fast: false
      matrix:
        browser: ${{ github.event_name == 'pull_request' && fromJSON('["chromium"]') || fromJSON('["chromium","webkit","firefox"]') }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Use Node.js 22.x
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.x
          cache: 'npm'
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: fider-image
          path: ./out
      - run: docker load --input ./out/fider-image.tar
      - run: |
          docker run \
            --pull never \
            -p 3000:3000 \
            --env DATABASE_URL=postgres://fider_ci:fider_ci_pw@postgres:5432/fider_ci?sslmode=disable \
            --env JWT_SECRET=not_so_secret \
            --env HOST_MODE=multi \
            --env HOST_DOMAIN=dev.fider.io \
            --env SSL_CERT=dev-fider-io.crt \
            --env SSL_CERT_KEY=dev-fider-io.key \
            --env EMAIL_NOREPLY=noreply@fider.io \
            --env EMAIL_SMTP_HOST=mailhog \
            --env EMAIL_SMTP_PORT=1025 \
            -d --network "${{ job.container.network }}" \
            -v "$PWD"/etc:/app/etc \
            fider-image
      - run: npm ci
      - run: npx playwright install --with-deps $BROWSER
        env:
          BROWSER: ${{ matrix.browser }}
      - run: make test-e2e-ui
        env:
          BROWSER: ${{ matrix.browser }}

  test-e2e-server:
    timeout-minutes: 60
    name: test-e2e-server
    runs-on: ubuntu-26.04
    needs: [build]
    services:
      mailhog:
        image: mailhog/mailhog:latest@sha256:8d76a3d4ffa32a3661311944007a415332c4bb855657f4f6c57996405c009bea
        ports:
          - "8025:8025"
          - "1025:1025"
      postgres:
        image: postgres:17@sha256:3b0cda93be7c8dba2ed484d19393d93845dc3dafb88973e248ba8e6d99d784e1
        env:
          POSTGRES_USER: fider_ci
          POSTGRES_PASSWORD: fider_ci_pw
          POSTGRES_DB: fider_ci
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Use Node.js 22.x
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.x
          cache: 'npm'
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: fider-image
          path: ./out
      - run: docker load --input ./out/fider-image.tar
      - run: |
          docker run \
            --pull never \
            -p 3000:3000 \
            -p 4000:4000 \
            --env DATABASE_URL=postgres://fider_ci:fider_ci_pw@postgres:5432/fider_ci?sslmode=disable \
            --env JWT_SECRET=not_so_secret \
            --env HOST_MODE=multi \
            --env HOST_DOMAIN=dev.fider.io \
            --env METRICS_ENABLED=true \
            --env SSL_CERT=dev-fider-io.crt \
            --env SSL_CERT_KEY=dev-fider-io.key \
            --env EMAIL_NOREPLY=noreply@fider.io \
            --env EMAIL_SMTP_HOST=mailhog \
            --env EMAIL_SMTP_PORT=1025 \
            -d --network "${{ job.container.network }}" \
            -v "$PWD"/etc:/app/etc \
            fider-image
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        env:
          BROWSER: chromium
      - run: make test-e2e-server
        env:
          BROWSER: chromium
